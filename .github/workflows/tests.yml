name: Offline regression tests

on:
  push:
    branches: [main, feat/agent-generation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agent.txt
      - run: python -m pip install -r requirements-agent.txt
      - name: Run isolated HTTP, MCP and generation regressions
        run: python -m unittest discover -s tests -p 'test*.py'
